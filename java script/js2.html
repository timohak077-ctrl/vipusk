<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: linear-gradient(135deg, #b2f7ef, #d7f9f1);
            font-family: Arial, sans-serif;
        }

        .block {
            font-size: 42px;
            padding: 15px 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .earth {
            background: linear-gradient(135deg, #00c853, #006400);
            color: white;
        }

        .vasil {
            background: linear-gradient(135deg, #ffe600, #ff9800);
            color: #4a148c;
        }
    </style>
</head>

<body>

    <div class="block earth">
        🌍 Земля
    </div>

    <div class="block vasil">
        ⚡ Василь
    </div>

    <script>
        let text, count = 5;

        text = "Hello World!";
        alert(text);
        alert(count);

        text = "Hello JavaScript";
        alert(text);

        let ourPlanetName = "земля";
        let currentUserName = "василь";

        alert(ourPlanetName);
        alert(currentUserName);

        document.writeln(`<p>${ourPlanetName}</p>`);
        document.writeln(`<p>${currentUserName}</p>`);
    </script>

</body>
</html>

⚠️ Важно: alert() будет показывать
